services:
  - type: web
    name: expense-tracker
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STACK_PROJECT_ID
        sync: false
      - key: STACK_PUBLISHABLE_CLIENT_KEY
        sync: false
